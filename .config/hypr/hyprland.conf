# Monitor Rules
monitor=DP-3, 1920x1080@240, 0x0, 1
monitor=HDMI-A-1, 2560x1440@120, 1920x0, 1

# Workspace Rules
workspace=1, monitor:DP-3
workspace=2, monitor:DP-3
workspace=3, monitor:DP-3
workspace=4, monitor:DP-3
workspace=5, monitor:DP-3
workspace=6, monitor:DP-3
workspace=7, monitor:DP-3
workspace=8, monitor:DP-3
workspace=9, monitor:DP-3
workspace=10, monitor:DP-3
workspace=11, monitor:HDMI-A-1
workspace=12, monitor:HDMI-A-1
workspace=13, monitor:HDMI-A-1
workspace=14, monitor:HDMI-A-1
workspace=15, monitor:HDMI-A-1
workspace=16, monitor:HDMI-A-1
workspace=17, monitor:HDMI-A-1
workspace=18, monitor:HDMI-A-1
workspace=19, monitor:HDMI-A-1
workspace=20, monitor:HDMI-A-1

# Startup Scripts
exec-once = ~/.scripts/startup
env = XCURSOR_SIZE,24

input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    repeat_rate = 30
    repeat_delay = 250

    follow_mouse = 1

    touchpad {
        natural_scroll = no
    }

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
}

general {
    gaps_in = 3
    gaps_out = 15
    border_size = 2
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    layout = dwindle
}

decoration {
    # See https://wiki.hyprland.org/Configuring/Variables/ for more

    rounding = 5
    
    blur {
        enabled = true
        size = 0
        passes = 2
    }

    inactive_opacity = 0.92
    active_opacity = 0.98
}

animations {
    enabled = yes

    bezier = md3_standard, 0.2, 0, 0, 1
    bezier = md3_decel, 0.05,0.7,0.1,1
    bezier = md3_accel, 0.3, 0, 0.8, 0.15
    bezier = overshot, 0.05, 0.9, 0.1, 1.1
    bezier = crazyshot, 0.1, 1.5, 0.76,0.92
    bezier = hyprnostretch, 0.05, 0.9, 0.1, 1.0
    bezier = fluent_decel, 0.1, 1, 0, 1
    bezier = easeInOutCirc, 0.05, 0, 0.15, 1
    bezier = easeOutCirc, 0, 0.55, 0.45, 1

    animation = windows, 1, 5, overshot, popin 80%
    animation = border, 1, 5, default
    animation = fade, 1, 2, default
    animation = workspaces, 1, 2, default
    animation = specialWorkspace, 1, 3, md3_decel, fade
}

dwindle {
    preserve_split = yes
}

misc {
    disable_hyprland_logo = true
}


# Window Rules
# Discord
windowrule {
  name = discord_float
  match:class = (discord)
  float = on
  size = (monitor_w*0.90) (monitor_h*0.90)
  move = (monitor_w*0.05) (monitor_h*0.06)
}

# Slack
windowrule {
  name = slack_float
  match:class = (Slack)
  float = on
  size = (monitor_w*0.90) (monitor_h*0.90)
  move = (monitor_w*0.05) (monitor_h*0.06)
}

# Telegram
windowrule {
  name = telegram_float
  match:class = (org.telegram.desktop)
  workspace = special:telegram
  float = on
  size = (monitor_w*0.30) (monitor_h*0.85)
  move = (monitor_w*0.35) (monitor_h*0.06)
}

# ranger
windowrule {
    name = ranger_float
    match:title = ranger
    float = on
    size = (monitor_w*0.60) (monitor_h*0.60)
    move = (monitor_w*0.20) (monitor_h*0.18)
}

# Emacs -> main monitor (workspace 1 lives on DP-3)
windowrule {
    name = emacs_main_monitor
    match:class = (Emacs)
    workspace = 1
}

# Key Bindings
$mainMod = SUPER

## Essential Bindings
bind = $mainMod, RETURN, exec, alacritty
bind = $mainMod SHIFT, RETURN, exec, firefox-developer-edition
bind = $mainMod, Q, killactive,
bind = $mainMod SHIFT, Q, exit
# bind = $mainMod, D, exec, rofi -show drun
bind = $mainMod, D, exec, sh -c 'echo toggle > /tmp/qs-launcher-toggle'

## Resolution Bindings
bind = $mainMod CTRL SHIFT, 1, exec, hyprctl keyword monitor DP-3,1920x1080@240,0x0,1
bind = $mainMod CTRL SHIFT, 2, exec, hyprctl keyword monitor DP-3, 1920x1080@240,0x0, 1, transform, 1
bind = $mainMod CTRL SHIFT, R, exec, ~/.scripts/rotatescreen

bind = , F1, exec, ~/.config/hypr/setbrightness 2 -10
bind = , F2, exec, ~/.config/hypr/setbrightness 2 +10
bind = , XF86MonBrightnessDown, exec, ~/.config/hypr/setbrightness 1 -10
bind = , XF86MonBrightnessUp, exec, ~/.config/hypr/setbrightness 1 +10

## Media Bindings
bind = , XF86Audioraisevolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bind = , XF86Audiolowervolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bind = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle

## Sonos Speaker Bindings (plain F10/F11/F12)
binde = , F12, exec, /home/prayuj/.nix-profile/bin/python3 /home/prayuj/.config/quickshell/scripts/sonos-vol up
binde = , F11, exec, /home/prayuj/.nix-profile/bin/python3 /home/prayuj/.config/quickshell/scripts/sonos-vol down
bind = , F10, exec, /home/prayuj/.nix-profile/bin/python3 /home/prayuj/.config/quickshell/scripts/sonos-vol mute
bind = , XF86AudioPrev, exec, playerctl previous
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPlay, exec, playerctl play-pause

## Screenshot Bindings
bind = $mainMod CTRL SHIFT, 3, exec, HYPRSHOT_DIR='/home/prayuj/Pictures/screenshots' hyprshot -m output
bind = $mainMod CTRL SHIFT, 4, exec, HYPRSHOT_DIR='/home/prayuj/Pictures/screenshots' hyprshot -m region
bind = $mainMod CTRL SHIFT, 5, exec, HYPRSHOT_DIR='/home/prayuj/Pictures/screenshots' hyprshot -m window
bind = $mainMod CTRL SHIFT, 6, exec, hyprcap rec -n -o '/home/prayuj/Pictures/recordings'

## App Toggle Bindings
bind = $mainMod, T, exec, sh -c 'echo toggle > /tmp/qs-telegram-toggle'
bind = $mainMod, R, exec, sh -c 'echo toggle > /tmp/qs-telegram-toggle'
bind = $mainMod SHIFT, N, exec, sh -c 'echo toggle > /tmp/qs-news-toggle'
# bind = $mainMod SHIFT, P, exec, sh -c 'echo toggle > /tmp/qs-portfolio-toggle'  # portfolio widget temporarily hidden
bind = $mainMod SHIFT, SPACE, exec, sh -c 'echo toggle > /tmp/qs-media-toggle'
bind = $mainMod SHIFT, I, exec, sh -c 'echo toggle > /tmp/qs-notif-toggle'

## Window Bindings
bind = $mainMod, SPACE, togglefloating,
bind = $mainMod, F, fullscreen

bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d

bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

## Workspace Bindings
bind = $mainMod, 1, exec, ~/.config/hypr/workspace focus 1
bind = $mainMod, 2, exec, ~/.config/hypr/workspace focus 2
bind = $mainMod, 3, exec, ~/.config/hypr/workspace focus 3
bind = $mainMod, 4, exec, ~/.config/hypr/workspace focus 4
bind = $mainMod, 5, exec, ~/.config/hypr/workspace focus 5
bind = $mainMod, 6, exec, ~/.config/hypr/workspace focus 6
bind = $mainMod, 7, exec, ~/.config/hypr/workspace focus 7
bind = $mainMod, 8, exec, ~/.config/hypr/workspace focus 8
bind = $mainMod, 9, exec, ~/.config/hypr/workspace focus 9
bind = $mainMod, 0, exec, ~/.config/hypr/workspace focus 10

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

## Window + Workspace Bindings
bind = $mainMod SHIFT, 1, exec, ~/.config/hypr/workspace move 1
bind = $mainMod SHIFT, 2, exec, ~/.config/hypr/workspace move 2
bind = $mainMod SHIFT, 3, exec, ~/.config/hypr/workspace move 3
bind = $mainMod SHIFT, 4, exec, ~/.config/hypr/workspace move 4
bind = $mainMod SHIFT, 5, exec, ~/.config/hypr/workspace move 5
bind = $mainMod SHIFT, 6, exec, ~/.config/hypr/workspace move 6
bind = $mainMod SHIFT, 7, exec, ~/.config/hypr/workspace move 7
bind = $mainMod SHIFT, 8, exec, ~/.config/hypr/workspace move 8
bind = $mainMod SHIFT, 9, exec, ~/.config/hypr/workspace move 9
bind = $mainMod SHIFT, 0, exec, ~/.config/hypr/workspace move 10

## Alt-Tab Behavior
bind = $mainMod, Tab, cyclenext, prev
bind = $mainMod, Tab, bringactivetotop

bind = ALT, Tab, cyclenext, prev
bind = ALT, Tab, bringactivetotop
