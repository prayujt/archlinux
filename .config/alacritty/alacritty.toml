[cursor.style]
shape = "Beam"

[cursor.vi_mode_style]
shape = "Block"

[font]
size = 11

[font.bold]
family = "JetBrains Mono"
style = "Regular"

[font.bold_italic]
family = "JetBrains Mono"
style = "Bold Italic"

[font.italic]
family = "JetBrains Mono"
style = "Italic"

[font.normal]
family = "JetBrains Mono"
style = "Regular"

[[keyboard.bindings]]
action = "ScrollLineUp"
key = "K"
mods = "Control"

[[keyboard.bindings]]
action = "ScrollLineDown"
key = "J"
mods = "Control"

[[keyboard.bindings]]
action = "SearchBackward"
key = "F"
mods = "Control"

[[keyboard.bindings]]
action = "SearchFocusPrevious"
key = "N"
mode = "Search"
mods = "Control"

[[keyboard.bindings]]
action = "SearchFocusNext"
key = "N"
mode = "Search"
mods = "Control|Shift"

[[keyboard.bindings]]
action = "SearchConfirm"
key = "Escape"
mode = "Search"
